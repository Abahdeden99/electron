name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: evoting-pilkades-windows-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
